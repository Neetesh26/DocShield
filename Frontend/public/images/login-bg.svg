<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faf5ff"/>
      <stop offset="50%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <pattern id="vault-grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#d8b4fe" stroke-width="0.75" stroke-opacity="0.35"/>
      <circle cx="60" cy="60" r="2" fill="#c084fc" fill-opacity="0.4"/>
      <circle cx="0" cy="0" r="2" fill="#c084fc" fill-opacity="0.4"/>
    </pattern>
    <linearGradient id="glow-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Base Gradient -->
  <rect width="1440" height="900" fill="url(#bg-grad)"/>

  <!-- Grid Overlay for Physical Vault & Coordinates -->
  <rect width="1440" height="900" fill="url(#vault-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="320" fill="url(#glow-1)"/>
  <circle cx="1240" cy="720" r="360" fill="url(#glow-2)"/>

  <!-- Decorative Isometric Vault Lines & Document Motifs -->
  <g opacity="0.25" stroke="#7e22ce" stroke-width="1.2">
    <!-- Top-left document badge shape -->
    <path d="M 120,80 L 220,80 L 260,120 L 260,260 L 120,260 Z" fill="#f3e8ff" fill-opacity="0.5"/>
    <line x1="150" y1="130" x2="230" y2="130"/>
    <line x1="150" y1="160" x2="230" y2="160"/>
    <line x1="150" y1="190" x2="210" y2="190"/>
    <line x1="150" y1="220" x2="190" y2="220"/>

    <!-- Bottom-right storage coordinate isometric cubes -->
    <path d="M 1200,650 L 1280,600 L 1360,650 L 1280,700 Z" fill="#ede9fe" fill-opacity="0.6"/>
    <path d="M 1200,650 L 1200,750 L 1280,800 L 1280,700 Z" fill="#ddd6fe" fill-opacity="0.4"/>
    <path d="M 1280,700 L 1280,800 L 1360,750 L 1360,650 Z" fill="#c4b5fd" fill-opacity="0.3"/>

    <path d="M 1100,710 L 1180,660 L 1260,710 L 1180,760 Z" fill="#ede9fe" fill-opacity="0.6"/>
    <path d="M 1100,710 L 1100,810 L 1180,860 L 1180,760 Z" fill="#ddd6fe" fill-opacity="0.4"/>
    <path d="M 1180,760 L 1180,860 L 1260,810 L 1260,710 Z" fill="#c4b5fd" fill-opacity="0.3"/>
  </g>
</svg>
